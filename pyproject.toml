[project]
name = "clockyfy-automation"
version = "0.1.0"
description = "Sync JIRA In-Progress activity into Clockify time entries."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Frank Castellanos", email = "ing.fcastellanos@gmail.com" },
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
clockyfy-sync = "clockyfy_automation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clockyfy_automation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
